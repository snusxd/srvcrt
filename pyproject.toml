[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srvcrt"
version = "0.1.0"
description = "Create a Minecraft server modpack from an installed client modpack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
srvcrt = "srvcrt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
